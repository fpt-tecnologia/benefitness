name: Actualizar la imagen de la promocion

# Revisa OneDrive cada hora. Si Marketing reemplazo la imagen, la publica en el sitio.
# Tambien se puede lanzar a mano desde la pestana Actions, con "Run workflow".

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-imagen
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pillow

      - name: Bajar y optimizar la imagen
        run: python sincronizar-imagen.py

      - name: Publicar si cambio
        run: |
          if git diff --quiet -- promo.jpg; then
            echo "Sin cambios: la imagen sigue igual."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo.jpg
          git commit -m "Actualiza la imagen de la promocion desde OneDrive"
          git push
          echo "Imagen actualizada y publicada."
