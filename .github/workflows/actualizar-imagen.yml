name: Actualizar las imagenes de la promocion

# Revisa OneDrive cada hora. Si Marketing agrego, quito o reemplazo imagenes, las publica.
# Tambien se puede lanzar a mano desde la pestana Actions, con "Run workflow".

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-imagen
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pillow

      - name: Bajar y optimizar las imagenes
        run: python sincronizar-imagenes.py

      - name: Publicar si cambio
        run: |
          git add -A promo-*.jpg imagenes.json
          if git diff --cached --quiet; then
            echo "Sin cambios: las imagenes siguen igual."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza las imagenes de la promocion desde OneDrive"
          git push
          echo "Imagenes actualizadas y publicadas."
