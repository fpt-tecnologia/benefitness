<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benefitness</title>
<meta name="description" content="Descuentos exclusivos pf Black Card en marcas participantes.">
<style>
  :root {
    --fondo: #12001f;
    --texto: #ffffff;
    --texto-suave: #cbb9da;
    --amarillo: #ffe600;
    --borde: rgba(255,255,255,.14);
    --ancho-lamina: 78%;   /* lo que mide la del centro; el resto deja ver las vecinas */
    --separacion: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100svh;        /* evita el salto por la barra del navegador en el celular */
    overflow-x: hidden;
  }

  /* El fondo manda: todo se acomoda dentro de él, en su misma proporción, para que el
     carrusel caiga siempre debajo del encabezado del diseño. */
  .escenario {
    position: relative;
    width: 100%;
    max-width: 520px;      /* en pantallas anchas se queda del ancho de un celular */
    height: 100svh;
    background-color: var(--fondo);
    background-image: var(--fondo-imagen, none);
    background-size: cover;
    background-position: center top;
    overflow: hidden;
  }
  .contenedor {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--inicio-contenido, 35%);
    bottom: 3%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Carrusel: la del centro se ve completa y las de los lados asoman, atenuadas. */
  .carrusel {
    display: flex;
    align-items: flex-start;
    gap: var(--separacion);
    transition: height .35s ease;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 4px 0;  /* los márgenes laterales los calcula el script, para poder centrar
                        también la primera y la última */
  }
  .carrusel::-webkit-scrollbar { display: none; }

  .lamina {
    flex: 0 0 var(--lamina-px, var(--ancho-lamina));
    scroll-snap-align: center;
    border-radius: var(--radio-lamina, 14px);  /* igual que las esquinas del diseño */
    overflow: hidden;
    background: transparent;
    opacity: .4;
    transform: scale(.93);
    transition: opacity .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .lamina.activa {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 12px 38px rgba(0,0,0,.5);
  }
  .promo { display: block; width: 100%; height: auto; }
  .aviso {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 9 / 16;
    padding: 24px;
    text-align: center;
    color: var(--texto-suave);
    font-size: .95rem;
  }

  /* Controles: flechas a los lados de los puntos, como en la referencia. */
  .controles {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .flecha {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--texto-suave);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: color .2s ease, background .2s ease;
  }
  .flecha:hover { color: var(--texto); background: rgba(255,255,255,.08); }
  .puntos { display: flex; gap: 2px; }
  /* El botón mide 28px para que el dedo le atine; el puntito visible es el de ::after. */
  .punto {
    width: 28px;
    height: 44px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .punto::after {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.28);
    transition: background .2s ease, transform .2s ease;
  }
  .punto[aria-current="true"]::after {
    background: var(--amarillo);
    transform: scale(1.3);
  }

  .pie {
    margin: 14px auto 0;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    max-width: 420px;
    padding: 0 16px;
    text-align: center;
    color: rgba(255,255,255,.85);
    font-size: .78rem;
    line-height: 1.45;
  }

  @media (prefers-reduced-motion: reduce) {
    .carrusel { scroll-behavior: auto; }
    .lamina { transition: none; }
  }
</style>
</head>
<body>
  <div class="escenario" id="escenario">
  <main class="contenedor">
    <div class="carrusel" id="carrusel" aria-label="Promociones Benefitness"></div>

    <div class="controles" id="controles" hidden>
      <button class="flecha" id="anterior" type="button" aria-label="Promoción anterior">&#8249;</button>
      <div class="puntos" id="puntos"></div>
      <button class="flecha" id="siguiente" type="button" aria-label="Promoción siguiente">&#8250;</button>
    </div>

    <p class="pie">
      Consulta términos y condiciones en planetfitness.mx/descuentos<br>
      Promoción válida para socios inscritos con la membresía PF Black Card®.
    </p>
  </main>
  </div>

<script>
  // Medición con Microsoft Clarity. El QR de cada club trae ?c=<etiqueta> en la liga, y esa
  // etiqueta se manda como "club" para poder separar los escaneos por sucursal.
  // Mientras CLARITY esté vacío no se carga nada ni se manda ningún dato.
  var CLARITY = "yr2mvc2xmw";

  (function () {
    if (!CLARITY) return;
    var club = (new URLSearchParams(location.search).get("c") || "sin-etiqueta")
      .replace(/[^a-z0-9-]/gi, "").slice(0, 40).toLowerCase();

    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", CLARITY);

    window.clarity("set", "club", club);
  })();

  // Las imágenes las publica sincronizar-imagenes.py desde OneDrive, cada hora.
  var SEGUNDOS = 5;   // cada cuánto cambia de imagen
  var ESPERA = 10;    // cuánto espera para reanudar después de que alguien desliza
  var carrusel = document.getElementById("carrusel");
  var controles = document.getElementById("controles");
  var puntos = document.getElementById("puntos");
  var laminas = 0;
  var actual = 0;
  var automatico = null;
  var espera = null;
  var desplazando = false;
  var finDesplazamiento = null;
  var finScroll = null;

  function aviso(texto) {
    carrusel.innerHTML = '<div class="lamina activa"><div class="aviso">' + texto + "</div></div>";
  }

  function paso() {
    // Ancho de una lámina más la separación: lo que hay que recorrer para cambiar de imagen.
    var primera = carrusel.querySelector(".lamina");
    if (!primera) return carrusel.clientWidth;
    var separacion = parseFloat(getComputedStyle(carrusel).columnGap) || 0;
    // offsetWidth, no getBoundingClientRect: el rect viene encogido por el efecto de escala.
    return primera.offsetWidth + separacion;
  }

  // El hueco de los lados debe ser justo lo que sobra de la lámina del centro. Así la
  // primera y la última también quedan centradas, con su vecina asomando.
  function ajustarMargenes() {
    var disponible = carrusel.parentElement.clientWidth;
    var proporcion = parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue("--ancho-lamina")
    ) / 100;
    if (!disponible || !proporcion) return;

    // La tarjeta se limita por lo ancho y también por lo alto: en pantallas cortas manda el
    // alto, para que la promoción nunca salga cortada.
    var img = carrusel.querySelector("img");
    var forma = img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1.25;
    var alto = carrusel.parentElement.clientHeight
      - (controles.hidden ? 0 : controles.offsetHeight + 10)
      - (document.querySelector(".pie").offsetHeight + 14)
      - 8;

    var lamina = Math.round(Math.min(disponible * proporcion, alto / forma));
    if (lamina < 120) lamina = Math.round(disponible * proporcion);

    var sobra = Math.max(0, (disponible - lamina) / 2);
    carrusel.style.setProperty("--lamina-px", lamina + "px");
    carrusel.style.setProperty("--radio-lamina", Math.round(lamina * 0.04) + "px");
    carrusel.style.paddingLeft = sobra + "px";
    carrusel.style.paddingRight = sobra + "px";
  }

  function pintarControles() {
    if (laminas < 2) return;
    for (var i = 0; i < laminas; i++) {
      var p = document.createElement("button");
      p.className = "punto";
      p.type = "button";
      p.setAttribute("aria-label", "Ver promoción " + (i + 1) + " de " + laminas);
      p.addEventListener("click", (function (indice) {
        return function () { irA(indice); pausar(); };
      })(i));
      puntos.appendChild(p);
    }
    document.getElementById("anterior").addEventListener("click", function () {
      irA((actual - 1 + laminas) % laminas); pausar();
    });
    document.getElementById("siguiente").addEventListener("click", function () {
      irA((actual + 1) % laminas); pausar();
    });
    controles.hidden = false;
    marcar(0);
  }

  function marcar(indice) {
    actual = indice;
    var botones = puntos.children;
    for (var i = 0; i < botones.length; i++) {
      botones[i].setAttribute("aria-current", i === indice ? "true" : "false");
    }
    var todas = carrusel.children;
    for (var j = 0; j < todas.length; j++) {
      todas[j].classList.toggle("activa", j === indice);
    }
    ajustarAlto();
  }

  // Las promociones no siempre traen la misma proporción: unas son horizontales y otras
  // verticales. El carrusel toma el alto de la que está al centro, para que ninguna salga
  // recortada ni con barras negras.
  function ajustarAlto() {
    var activa = carrusel.children[actual];
    if (!activa) return;
    // offsetHeight ignora el efecto de escala; con el rect la imagen salía recortada abajo.
    var alto = activa.offsetHeight;
    if (alto) carrusel.style.height = Math.ceil(alto) + 2 + "px";
  }

  window.addEventListener("resize", function () {
    carrusel.style.height = "";
    ajustarMargenes();
    setTimeout(function () { irA(actual); }, 60);
  });

  function irA(indice) {
    // Mientras el carrusel se desliza solo, no se vuelve a calcular el índice: la posición
    // intermedia haría parpadear los puntos y el alto.
    desplazando = true;
    clearTimeout(finDesplazamiento);
    finDesplazamiento = setTimeout(function () { desplazando = false; }, 600);
    carrusel.scrollTo({ left: paso() * indice, behavior: "smooth" });
    marcar(indice);
  }

  function avanzarSolo() {
    if (laminas < 2 || automatico) return;
    automatico = setInterval(function () {
      irA((actual + 1) % laminas);
    }, SEGUNDOS * 1000);
  }

  // Mientras la persona desliza, el avance automático se detiene; se reanuda al soltar.
  function pausar() {
    if (automatico) { clearInterval(automatico); automatico = null; }
    clearTimeout(espera);
    espera = setTimeout(avanzarSolo, ESPERA * 1000);
  }

  // Se recalcula cuando la persona termina de deslizar, no en cada pixel.
  carrusel.addEventListener("scroll", function () {
    if (desplazando) return;
    clearTimeout(finScroll);
    finScroll = setTimeout(function () {
      var ancho = paso();
      if (!ancho) return;
      var indice = Math.min(laminas - 1, Math.round(carrusel.scrollLeft / ancho));
      if (indice !== actual && indice >= 0) marcar(indice);
    }, 120);
  }, { passive: true });

  carrusel.addEventListener("touchstart", pausar, { passive: true });
  carrusel.addEventListener("pointerdown", pausar, { passive: true });
  carrusel.addEventListener("wheel", pausar, { passive: true });

  fetch("imagenes.json?v=" + Math.floor(Date.now() / 60000))
    .then(function (r) { return r.json(); })
    .then(function (datos) {
      if (datos && datos.fondo) {
        document.getElementById("escenario").style
          .setProperty("--fondo-imagen", 'url("' + datos.fondo + '")');
      }
      var lista = (datos && datos.imagenes) || [];
      if (!lista.length) { aviso("No hay promociones por ahora."); return; }
      carrusel.innerHTML = lista.map(function (nombre, i) {
        return '<div class="lamina"><img class="promo" src="' + nombre +
               '" alt="Promoción Benefitness ' + (i + 1) + ' de ' + lista.length +
               '" loading="' + (i === 0 ? "eager" : "lazy") + '"></div>';
      }).join("");
      laminas = lista.length;
      // Cuando cada imagen termina de cargar puede cambiar el alto: se vuelve a medir.
      Array.prototype.forEach.call(carrusel.querySelectorAll("img"), function (img) {
        img.addEventListener("load", function () { ajustarMargenes(); ajustarAlto(); });
      });
      ajustarMargenes();
      if (laminas === 1) {
        carrusel.firstElementChild.classList.add("activa");
        setTimeout(ajustarAlto, 60);
        return;
      }
      pintarControles();
      avanzarSolo();
    })
    .catch(function () {
      aviso("No se pudieron cargar las promociones. Revisa tu conexión e inténtalo de nuevo.");
    });
</script>
</body>
</html>
